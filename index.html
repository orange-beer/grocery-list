<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每周买菜清单</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #f5f5f5;
  --primary: #07c160;
  --text: #222;
  --muted: #888;
  --line: #e5e5e5;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body { padding-bottom: 30px; }

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  background: var(--primary); color: #fff;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
}
.topbar h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
.stats { margin: 0; font-size: 13px; opacity: .9; }
.progress { height: 4px; margin-top: 8px; background: rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; }
.progress-bar { width: 0%; height: 100%; background: #fff; border-radius: 2px; transition: width .25s ease; }
.top-actions {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px;
}
.top-actions .btn {
  height: 36px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none;
  display: flex; align-items: center; justify-content: center;
}
.btn-outline { background: rgba(255,255,255,.25); color: #fff; }
.btn-primary { background: #fff; color: var(--primary); }
.btn:active { opacity: .8; }

.cat-tabs {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
  background: #fff; border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch;
  margin-top: 130px;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex: 0 0 auto; padding: 5px 13px; border-radius: 15px;
  font-size: 13px; color: #555; background: #f2f2f2; white-space: nowrap;
}
.cat-tab.active { color: #fff; background: var(--primary); }

.grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  padding: 12px 16px;
  padding-top: 190px;
}
.card {
  position: relative; min-height: 104px; padding: 10px 8px 12px;
  background: #fff; border: 2px solid transparent; border-radius: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05); transition: border-color .2s ease, background-color .2s ease;
}
.card.checked { border-color: var(--primary); background: #f0fbf5; }
.card-icon { height: 44px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.card-name { font-size: 14px; font-weight: 600; text-align: center; line-height: 1.3; }
.card-meta { margin-top: 2px; font-size: 11px; text-align: center; color: var(--muted); }
.card-badge { position: absolute; top: 6px; left: 6px; padding: 1px 6px; font-size: 10px; font-weight: 600; border-radius: 4px; }
.badge-meat { background: #ffeef0; color: #e04848; }
.badge-fish { background: #eef4ff; color: #3a7bd5; }
.badge-season { background: #e8f8ef; color: #07a35a; }
.check-circle {
  position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
  border: 2px solid #ccc; border-radius: 50%; background: #fff; transition: border-color .2s ease, background-color .2s ease;
}
.card.checked .check-circle { border-color: var(--primary); background: var(--primary); }
.check-circle::after {
  content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 9px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0;
}
.card.checked .check-circle::after { opacity: 1; }

.card-expand { height: 0; overflow: hidden; opacity: 0; transition: opacity .2s ease; }
.card.checked .card-expand { height: auto; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; opacity: 1; }
.qty-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
.qty-btn { width: 28px; height: 28px; border: 1px solid #ddd; border-radius: 50%; background: #fff; font-size: 16px; line-height: 1; }
.qty-num { min-width: 22px; font-size: 14px; font-weight: 600; text-align: center; }
.note-input { display: block; width: 100%; height: 30px; margin-top: 6px; padding: 0 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; }

/* 弹窗 */
.modal-mask {
  position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
  padding: 20px; background: rgba(0,0,0,.5);
}
.modal-mask.show { display: flex; }
.modal {
  width: 100%; max-width: 420px; max-height: calc(90vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow: auto; background: #fff; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.18); -webkit-overflow-scrolling: touch;
}
.modal-inner { padding: 18px 16px; }
.modal h3 { margin: 0 0 12px; font-size: 17px; text-align: center; }

/* 导出文字区 */
.export-area {
  width: 100%; min-height: 140px; padding: 10px; border: 1px solid #ddd; border-radius: 10px;
  font-size: 14px; line-height: 1.6; resize: vertical;
}

/* 弹窗按钮区 */
.modal-btns {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px;
}
.modal-btns .btn {
  height: 44px; border-radius: 10px; font-size: 15px; font-weight: 600; border: none;
  display: flex; align-items: center; justify-content: center;
}
.modal-btns .btn-outline { background: #f2f2f2; color: #555; }
.modal-btns .btn-primary { background: var(--primary); color: #fff; }
.modal-btns .btn:active { opacity: .8; }

.toast {
  position: fixed; left: 50%; top: 45%; z-index: 300; max-width: 80%; padding: 10px 16px;
  background: rgba(0,0,0,.75); color: #fff; font-size: 14px; text-align: center; border-radius: 8px;
  opacity: 0; pointer-events: none; transform: translate(-50%, -50%); transition: opacity .25s ease;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🛒 每周买菜清单</h1>
  <p class="stats" id="stats">已选 0 / 共 0 种</p>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="top-actions">
    <button class="btn btn-outline" onclick="selectAll()">全选</button>
    <button class="btn btn-outline" onclick="clearAll()">清空</button>
    <button class="btn btn-outline" onclick="showAdd()">＋ 自选</button>
    <button class="btn btn-primary" onclick="openShare()">🔗 分享</button>
  </div>
</div>

<div class="cat-tabs" id="catTabs"></div>
<div class="grid" id="grid"></div>

<!-- 导出文字弹窗（保留备用） -->
<div class="modal-mask" id="exportModal">
  <div class="modal"><div class="modal-inner">
    <h3>采购清单（文字）</h3>
    <textarea class="export-area" id="exportArea" readonly></textarea>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="document.getElementById('exportModal').classList.remove('show')">关闭</button>
      <button class="btn btn-primary" onclick="copyText()">复制文字</button>
    </div>
  </div></div>
</div>

<!-- 分享弹窗 -->
<div class="modal-mask" id="shareModal">
  <div class="modal"><div class="modal-inner">
    <h3>分享买菜清单</h3>
    <p style="font-size:13px;color:#888;margin:0 0 12px;text-align:center;line-height:1.5">
      家人打开链接或扫码后，会自动加载你勾选的清单<br>并可在自己手机上继续勾选
    </p>
    <div id="qrcode" style="display:flex;justify-content:center;padding:12px 0;background:#fafafa;border-radius:10px;min-height:200px"></div>
    <textarea class="export-area" id="shareUrl" readonly style="min-height:64px;margin-top:12px;font-size:12px"></textarea>
    <div class="modal-btns" style="grid-template-columns:1fr 1fr 1fr;gap:8px">
      <button class="btn btn-outline" onclick="hideShare()">关闭</button>
      <button class="btn btn-outline" onclick="copyShareUrl()">复制链接</button>
      <button class="btn btn-primary" onclick="shareNative()">分享</button>
    </div>
    <div style="margin-top:10px;text-align:center">
      <button class="btn btn-outline" style="height:34px;font-size:12px;padding:0 14px;border-radius:8px;background:#f2f2f2;color:#666;border:none" onclick="switchToText()">改为导出纯文字</button>
    </div>
  </div></div>
</div>

<!-- 添加自选食材弹窗 -->
<div class="modal-mask" id="addModal">
  <div class="modal"><div class="modal-inner">
    <h3>添加自选食材</h3>
    <div style="margin-bottom:10px"><input id="addName" placeholder="如：秋葵" style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:14px"></div>
    <div style="margin-bottom:10px">
      <select id="addCat" style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:14px">
        <option>叶菜</option><option>根茎</option><option>瓜果</option><option>菌菇</option><option>豆制品</option><option>调味</option><option>肉类</option><option>水产</option><option>蛋禽</option><option>其他</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="hideAdd()">取消</button>
      <button class="btn btn-primary" onclick="doAdd()">添加</button>
    </div>
  </div></div>
</div>

<div class="toast" id="toast"></div>

/* ==================== 渲染 ==================== */
function renderTabs(){
  els.catTabs.innerHTML = cats.map((c,i)=>
    `<button class="cat-tab ${i===0?"active":""}" onclick="filterCat('${c}',this)">${c}</button>`
  ).join("");
}
function filterCat(c, el){
  els.catTabs.querySelectorAll(".cat-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  currentList = c==="全部" ? items : items.filter(i=>i.c===c);
  renderGrid(currentList);
}
function renderGrid(list = currentList){
  els.grid.innerHTML = list.map(it=>{
    const s = state[it.n] || {on:false,q:1,note:""};
    let badge = "";
    if(it.c==="肉类") badge = `<span class="card-badge badge-meat">肉</span>`;
    else if(it.c==="水产") badge = `<span class="card-badge badge-fish">水产</span>`;
    else if(it.tag) badge = `<span class="card-badge badge-season">${it.tag}</span>`;
    // 处理含特殊字符的 id（如空格），用 encodeURIComponent 安全生成
    const safeId = encodeURIComponent(it.n);
    return `
      <div class="card ${s.on?"checked":""}" onclick="toggle('${esc(it.n)}')">
        <div class="card-icon">${it.icon||"🥬"}</div>
        <div class="card-name">${esc(it.n)}</div>
        <div class="card-meta">${it.c}</div>
        ${badge}
        <div class="check-circle"></div>
        <div class="card-expand" onclick="event.stopPropagation()">
          <div class="qty-row">
            <button class="qty-btn" onclick="chg('${esc(it.n)}',-1)">－</button>
            <span class="qty-num" id="q_${safeId}">${s.q}</span>
            <button class="qty-btn" onclick="chg('${esc(it.n)}',1)">＋</button>
          </div>
          <input class="note-input" placeholder="备注，如500g" value="${escAttr(s.note||"")}" onchange="updateNote('${esc(it.n)}',this.value)">
        </div>
      </div>
    `;
  }).join("");
  updateStats();
}

// 简单的转义，防止自选食材带引号破坏 HTML
function esc(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ==================== 操作 ==================== */
function toggle(id){
  state[id] = state[id] || {on:false,q:1,note:""};
  state[id].on = !state[id].on;
  save(); renderGrid();
}
function chg(id, d){
  state[id] = state[id] || {on:true,q:1,note:""};
  state[id].q = Math.max(1, (state[id].q||1) + d);
  state[id].on = true; save();
  const node = document.getElementById("q_"+encodeURIComponent(id));
  if(node) node.textContent = state[id].q;
  updateStats();
}
function updateNote(id, v){
  state[id] = state[id] || {on:true,q:1,note:""};
  state[id].note = v; state[id].on = true; save();
}
function save(){
  try{ localStorage.setItem("buyList", JSON.stringify(state)); }catch(e){}
  updateStats();
}
function updateStats(){
  const sel = Object.values(state).filter(s=>s.on);
  els.stats.textContent = `已选 ${sel.length} / 共 ${items.length} 种`;
  els.progressBar.style.width = (sel.length/items.length*100)+"%";
}
function selectAll(){
  items.forEach(i=>{ state[i.n] = {on:true, q: (state[i.n]&&state[i.n].q)||1, note: (state[i.n]&&state[i.n].note)||""}; });
  save(); renderGrid();
}
function clearAll(){
  if(!confirm("确定清空所有勾选吗？")) return;
  state = {};
  localStorage.removeItem("buyList_imported_hash");
  save(); renderGrid();
}
function showAdd(){ els.addModal.classList.add("show"); }
function hideAdd(){ els.addModal.classList.remove("show"); }
function doAdd(){
  const n = els.addName.value.trim();
  if(!n){ showToast("请填写食材名称"); return; }
  if(items.find(it=>it.n===n)){ showToast("已存在该食材"); return; }
  items.push({n, c: els.addCat.value, tag:"", icon:"🥬"});
  currentList = items;
  state[n] = {on:true, q:1, note:""};
  els.addName.value = "";
  save();
  // 重置到"全部" tab 显示
  els.catTabs.querySelectorAll(".cat-tab").forEach(t=>t.classList.remove("active"));
  const firstTab = els.catTabs.querySelector(".cat-tab");
  if(firstTab) firstTab.classList.add("active");
  currentList = items;
  renderGrid();
  hideAdd();
}

/* ==================== 导出文字（备用） ==================== */
function buildText(){
  const sel = Object.entries(state).filter(([,s])=>s.on);
  if(!sel.length) return "";
  let txt = "🛒 每周买菜清单\n\n";
  sel.forEach(([k,s])=>{ txt += `☐ ${k} ×${s.q}${s.note?`（${s.note}）`:""}\n`; });
  txt += `\n共 ${sel.length} 种`;
  return txt;
}
function exportList(){
  const txt = buildText();
  if(!txt){ showToast("还没有选择任何食材"); return; }
  els.exportArea.value = txt;
  els.exportModal.classList.add("show");
}
function copyText(){
  const ta = els.exportArea; ta.select(); ta.setSelectionRange(0,99999);
  try{
    navigator.clipboard.writeText(ta.value)
      .then(()=>{ showToast("已复制"); els.exportModal.classList.remove("show"); })
      .catch(()=>fallbackCopy(ta.value));
  } catch(e){ fallbackCopy(ta.value); }
}
function fallbackCopy(text){
  const ta = els.exportArea; ta.select();
  try { document.execCommand("copy"); } catch(e){}
  showToast("已复制"); els.exportModal.classList.remove("show");
}
function switchToText(){
  hideShare();
  exportList();
}

/* ==================== 分享链接 ==================== */
function buildShareUrl() {
  const sel = Object.entries(state).filter(([,s]) => s.on);
  if (!sel.length) return null;
  const compact = sel.map(([k, s]) => [k, s.q || 1, s.note || ""]);
  const data = encodeURIComponent(JSON.stringify(compact));
  const base = location.origin + location.pathname;
  return base + "#list=" + data;
}

function openShare() {
  const url = buildShareUrl();
  if (!url) { showToast("还没有选择任何食材"); return; }

  document.getElementById("shareUrl").value = url;

  const qrBox = document.getElementById("qrcode");
  qrBox.innerHTML = "";
  try {
    new QRCode(qrBox, {
      text: url,
      width: 180,
      height: 180,
      colorDark: "#000",
      colorLight: "#fff",
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch (e) {
    qrBox.innerHTML = '<div style="color:#aaa;font-size:12px;padding:20px">二维码生成失败，请用下方链接</div>';
  }

  document.getElementById("shareModal").classList.add("show");
}
function hideShare() {
  document.getElementById("shareModal").classList.remove("show");
}
function copyShareUrl() {
  const ta = document.getElementById("shareUrl");
  ta.select(); ta.setSelectionRange(0, 99999);
  const done = () => showToast("链接已复制");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(done).catch(()=>{
      try { document.execCommand("copy"); done(); } catch(e){}
    });
  } else {
    try { document.execCommand("copy"); done(); } catch(e){}
  }
}
function shareNative() {
  const url = document.getElementById("shareUrl").value;
  if (navigator.share) {
    navigator.share({ title: "每周买菜清单", text: "打开查看/编辑：", url }).catch(()=>{});
  } else {
    copyShareUrl();
  }
}

/* ==================== 首次导入 hash 数据 ==================== */
(function importFromHash() {
  if (!location.hash.startsWith("#list=")) return;

  const currentHash = location.hash.slice(6);
  const IMPORTED_KEY = "buyList_imported_hash";

  // 已导入过相同链接 → 不覆盖，清理 URL 即可
  if (localStorage.getItem(IMPORTED_KEY) === currentHash) {
    history.replaceState(null, "", location.pathname);
    return;
  }

  try {
    const raw = decodeURIComponent(currentHash);
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;

    state = {};
    arr.forEach(([n, q, note]) => {
      if (!n) return;
      state[n] = { on: true, q: q || 1, note: note || "" };
      if (!items.find(it => it.n === n)) {
        items.push({ n, c: "其他", tag: "", icon: "🛒" });
      }
    });

    save();
    localStorage.setItem(IMPORTED_KEY, currentHash);
    // 清 URL，避免刷新/书签重复导入
    history.replaceState(null, "", location.pathname);

    // 简单提示一下
    setTimeout(()=>{ showToast("已加载分享的清单"); }, 300);
  } catch (e) {
    console.warn("分享数据解析失败", e);
    history.replaceState(null, "", location.pathname);
  }
})();

/* ==================== 提示 ==================== */
function showToast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>els.toast.classList.remove("show"), 2200);
}

/* ==================== 弹窗点击遮罩关闭 ==================== */
document.querySelectorAll(".modal-mask").forEach(m=>{
  m.addEventListener("click", e=>{ if(e.target===m) m.classList.remove("show"); });
});

/* ==================== 启动 ==================== */
renderTabs();
renderGrid();
</script>
